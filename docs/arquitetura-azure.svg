<svg viewBox="0 0 1280 700" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="700" fill="#ffffff"/>

  <text x="640" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">CLYVO VET — recursos na Azure e fluxos entre eles</text>
  <text x="640" y="70" text-anchor="middle" font-size="13.5" fill="#475569">Opção 2 do edital: App Service + banco PaaS. Nada containerizado — nem a aplicação, nem o banco.</text>

  <!-- cliente -->
  <rect x="30" y="210" width="230" height="150" rx="10" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <text x="145" y="242" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">App móvel</text>
  <text x="145" y="264" text-anchor="middle" font-size="12" fill="#334155">Expo / React Native</text>
  <text x="145" y="284" text-anchor="middle" font-size="11.5" fill="#64748b">Expo Go — fora da Azure</text>
  <text x="145" y="312" text-anchor="middle" font-size="11.5" fill="#334155">Dois clientes HTTP</text>
  <text x="145" y="329" text-anchor="middle" font-size="11.5" fill="#334155">independentes, um por API</text>

  <!-- legenda de fluxos -->
  <rect x="30" y="395" width="230" height="225" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="44" y="420" font-size="13" font-weight="700" fill="#0f172a">Fluxos</text>

  <circle cx="52" cy="440" r="8.5" fill="#1e293b"/>
  <text x="52" y="444" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
  <text x="68" y="444" font-size="11.5" font-weight="600" fill="#0f172a">App → API Java</text>
  <text x="68" y="459" font-size="10.5" fill="#475569">HTTPS 443 · Bearer JWT</text>

  <circle cx="52" cy="481" r="8.5" fill="#1e293b"/>
  <text x="52" y="485" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>
  <text x="68" y="485" font-size="11.5" font-weight="600" fill="#0f172a">App → API .NET</text>
  <text x="68" y="500" font-size="10.5" fill="#475569">HTTPS 443 · X-Api-Key</text>

  <circle cx="52" cy="522" r="8.5" fill="#1e293b"/>
  <text x="52" y="526" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
  <text x="68" y="526" font-size="11.5" font-weight="600" fill="#0f172a">API Java → MySQL</text>
  <text x="68" y="541" font-size="10.5" fill="#475569">3306 · TLS · Flyway cria</text>
  <text x="68" y="555" font-size="10.5" fill="#475569">o schema (V1 → V9)</text>

  <circle cx="52" cy="577" r="8.5" fill="#1e293b"/>
  <text x="52" y="581" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text>
  <text x="68" y="581" font-size="11.5" font-weight="600" fill="#0f172a">API .NET → MySQL</text>
  <text x="68" y="596" font-size="10.5" fill="#475569">3306 · TLS · lê animal e</text>
  <text x="68" y="610" font-size="10.5" fill="#475569">tutor, nunca escreve</text>

  <!-- resource group -->
  <rect x="300" y="96" width="950" height="540" rx="14" fill="#f1f5f9" stroke="#0078d4" stroke-width="2" stroke-dasharray="9 5"/>
  <text x="320" y="126" font-size="13.5" font-weight="700" fill="#0f172a">Resource Group · rg-clyvovet-sprint3</text>
  <text x="320" y="145" font-size="11.5" fill="#475569">Região brazilsouth, uma só para tudo — evita consulta atravessando região · azure/01-resource-group.sh</text>

  <!-- app service plan -->
  <rect x="325" y="170" width="460" height="345" rx="11" fill="#ffffff" stroke="#0078d4" stroke-width="1.6"/>
  <text x="345" y="198" font-size="14" font-weight="700" fill="#0f172a">App Service Plan · plan-clyvovet-sprint3</text>
  <text x="345" y="217" font-size="11.5" fill="#334155">B1 Linux · 1 core · 1,75 GB · Always On · azure/03-plano-app-service.sh</text>
  <text x="345" y="235" font-size="11" fill="#b45309">UMA instância, autoscale desligado — há estado guardado no processo</text>

  <!-- web app java -->
  <rect x="345" y="255" width="420" height="118" rx="9" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="360" y="280" font-size="13.5" font-weight="700" fill="#0f172a">Web App · app-clyvovet-java-rm562312</text>
  <text x="360" y="300" font-size="11.5" fill="#334155">Runtime JAVA|17-java17 nativo — o artefato é o .jar, não imagem</text>
  <text x="360" y="319" font-size="11.5" fill="#334155">Dona de: tutor, animal, usuário, clínica, veterinário,</text>
  <text x="360" y="336" font-size="11.5" fill="#334155">evento clínico, pagamento, disponibilidade</text>
  <text x="360" y="357" font-size="10.5" fill="#64748b">azure/04-webapp-java.sh · azure/07-deploy-java.sh</text>

  <!-- web app dotnet -->
  <rect x="345" y="388" width="420" height="118" rx="9" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="360" y="413" font-size="13.5" font-weight="700" fill="#0f172a">Web App · app-clyvovet-dotnet-rm562312</text>
  <text x="360" y="433" font-size="11.5" fill="#334155">Runtime DOTNETCORE|8.0 nativo — sem container</text>
  <text x="360" y="452" font-size="11.5" fill="#334155">Dona de: produto, sugestão de produto, lembrete,</text>
  <text x="360" y="469" font-size="11.5" fill="#334155">evento pet, predisposição de saúde, vínculo Telegram</text>
  <text x="360" y="490" font-size="10.5" fill="#64748b">azure/05-webapp-dotnet.sh · azure/08-deploy-dotnet.sh</text>

  <!-- mysql -->
  <rect x="845" y="255" width="380" height="251" rx="11" fill="#ffffff" stroke="#0078d4" stroke-width="1.6"/>
  <text x="1035" y="288" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Azure Database for MySQL</text>
  <text x="1035" y="309" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Flexible Server</text>
  <text x="1035" y="338" text-anchor="middle" font-size="12.5" fill="#1d4ed8">mysql-clyvovet-rm562312</text>
  <text x="1035" y="361" text-anchor="middle" font-size="11.5" fill="#334155">Standard_B1ms · Burstable · MySQL 8.0</text>
  <text x="1035" y="383" text-anchor="middle" font-size="11.5" fill="#334155">Banco único: clyvovet</text>
  <text x="1035" y="413" text-anchor="middle" font-size="11.5" fill="#b45309">Provisionado VAZIO, de propósito:</text>
  <text x="1035" y="430" text-anchor="middle" font-size="11.5" fill="#b45309">quem cria o schema é o Flyway da Java</text>
  <text x="1035" y="457" text-anchor="middle" font-size="11.5" fill="#334155">TLS obrigatório — sslMode=REQUIRED</text>
  <text x="1035" y="474" text-anchor="middle" font-size="11.5" fill="#334155">Orçamento de conexões: 10 + 15</text>
  <text x="1035" y="496" text-anchor="middle" font-size="10.5" fill="#64748b">azure/02-banco-mysql.sh</text>

  <!-- fluxos -->
  <line x1="262" y1="298" x2="341" y2="310" stroke="#1e293b" stroke-width="1.8" marker-end="url(#seta)"/>
  <circle cx="299" cy="295" r="9" fill="#1e293b"/>
  <text x="299" y="299" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>

  <line x1="262" y1="344" x2="341" y2="443" stroke="#1e293b" stroke-width="1.8" marker-end="url(#seta)"/>
  <circle cx="296" cy="386" r="9" fill="#1e293b"/>
  <text x="296" y="390" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>

  <line x1="767" y1="310" x2="841" y2="336" stroke="#1e293b" stroke-width="1.8" marker-end="url(#seta)"/>
  <circle cx="804" cy="317" r="9" fill="#1e293b"/>
  <text x="804" y="321" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>

  <line x1="767" y1="443" x2="841" y2="420" stroke="#1e293b" stroke-width="1.8" marker-end="url(#seta)"/>
  <circle cx="804" cy="436" r="9" fill="#1e293b"/>
  <text x="804" y="440" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text>

  <!-- rodape -->
  <text x="320" y="556" font-size="11.5" font-weight="600" fill="#0f172a">Ordem de subida obrigatória:</text>
  <text x="320" y="574" font-size="11.5" fill="#334155">a API Java precisa subir antes da .NET. As seis tabelas que a .NET consome são criadas pelo Flyway no primeiro boot da Java —</text>
  <text x="320" y="591" font-size="11.5" fill="#334155">se a .NET subir primeiro, ela encontra um banco vazio. Na Azure isso é ordem de execução dos scripts, e não `depends_on`.</text>
  <text x="320" y="616" font-size="11" fill="#64748b">Todos os recursos criados por Azure CLI. Nenhum segredo nos scripts: senha, chave JWT e tokens entram como App Settings, lidos do ambiente.</text>

  <text x="1250" y="676" text-anchor="end" font-size="10.5" fill="#94a3b8">CLYVO VET · Sprint 3 · RM562312</text>
</svg>
