# Pipeline de CI/CD no Azure DevOps — requisitos C2 e C3 da spec 03.
#
# SOBRE O GATILHO (item C4 do backlog)
# A spec da disciplina cita `master`; este repositório usa `main`. As duas
# ficam declaradas abaixo: se o Azure DevOps espelhar o repositório com outro
# nome de branch padrão, o pipeline dispara do mesmo jeito, em vez de ficar em
# silêncio esperando um push numa branch que não existe.
trigger:
  branches:
    include:
      - main
      - master

pr:
  branches:
    include:
      - main
      - master

pool:
  vmImage: ubuntu-latest

variables:
  # A suíte roda em H2 em memória (perfil dev, fixado em
  # src/test/resources/application.properties). Sem credencial de banco e sem
  # rota até a FIAP — se dependesse do Oracle, todo build aqui falharia por
  # infraestrutura em vez de por defeito no código.
  MAVEN_CACHE_FOLDER: $(Pipeline.Workspace)/.m2/repository
  MAVEN_OPTS: '-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)'

stages:
  - stage: Build
    displayName: Build e testes
    jobs:
      - job: maven
        displayName: mvn verify
        steps:
          - task: Cache@2
            displayName: Cache do Maven
            inputs:
              key: 'maven | "$(Agent.OS)" | pom.xml'
              restoreKeys: 'maven | "$(Agent.OS)"'
              path: $(MAVEN_CACHE_FOLDER)

          - task: JavaToolInstaller@0
            inputs:
              versionSpec: '17'
              jdkArchitectureOption: x64
              jdkSourceOption: PreInstalled

          - script: ./mvnw -B verify
            displayName: Testes

          # Publica mesmo com a suíte vermelha: é aí que alguém precisa ver
          # qual teste quebrou, sem abrir o log inteiro.
          - task: PublishTestResults@2
            displayName: Resultado dos testes
            condition: always()
            inputs:
              testResultsFormat: JUnit
              testResultsFiles: '**/surefire-reports/TEST-*.xml'
              failTaskOnFailedTests: true

          - task: CopyFiles@2
            inputs:
              contents: 'target/*.jar'
              targetFolder: $(Build.ArtifactStagingDirectory)

          - publish: $(Build.ArtifactStagingDirectory)
            artifact: clyvovet-jar
            displayName: Publica o artefato

  # ============================================================
  # SEM ESTAGIO DE IMAGEM DOCKER, DE PROPOSITO
  #
  # Havia aqui um estagio "Imagem" que construia a imagem, e um estagio "Deploy"
  # comentado apontando para Azure Container Apps. Os dois foram removidos.
  #
  # A disciplina de DevOps exige escolher UMA opcao e nao misturar. A escolhida e
  # a Opcao 2 -- App Service com banco PaaS --, onde "App Containerizado" custa
  # -40 e "Banco Containerizado" custa outros -40. Um pipeline que publica imagem
  # e o caminho mais direto para o artefato errado chegar na nuvem.
  #
  # O Dockerfile continua no repositorio e serve ao desenvolvimento local, ao
  # docker-compose de integracao e ao CI. O proibido e o ARTEFATO PUBLICADO sair
  # dele -- e por isso o deploy vive em azure/07-deploy-java.sh, que publica o jar
  # gerado pelo estagio Build acima.
  #
  # O CD automatico e requisito da SPRINT 4, com Azure DevOps. Ver
  # docs/12-plano-de-entrega-sprint3.md, secao 9.
  # ============================================================
