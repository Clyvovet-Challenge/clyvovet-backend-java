# Onde a suíte roda.
#
#   ./mvnw test                        -> dev, H2 em memória
#   PERFIL_TESTE=oracle ./mvnw test    -> Oracle da FIAP, servidor real
#
# O padrão é dev porque o CI precisa rodar a cada push, sem credencial e sem
# rota até a FIAP. O Oracle responde "o banco real concorda" — pergunta que se
# faz antes de entregar, não a cada commit.
spring.profiles.active=${PERFIL_TESTE:dev}

# Este arquivo substitui o application.properties de main, então o que é comum
# aos dois precisa ser importado.
spring.config.import=classpath:comum.properties

# Não vale no modo oracle: lá a chave é ${JWT_SECRET}, sem fallback.
clyvovet.jwt.secret=dGVzdGUtY2x5dm92ZXQtY2hhdmUtaG1hYy1zaGEyNTYtcGFyYS10ZXN0ZXM=

# A suíte dispara dezenas de chamadas do mesmo endereço. O limite em si é
# coberto pelo RateLimitTest, que o liga via @TestPropertySource.
clyvovet.rate-limit.enabled=false
