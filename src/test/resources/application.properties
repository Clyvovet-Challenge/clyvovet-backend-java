# ===========================================================================
# Onde a suíte de testes roda.
#
#   ./mvnw test                        -> dev, H2 em memória (padrão)
#   PERFIL_TESTE=oracle ./mvnw test    -> Oracle da FIAP, servidor real
#
# POR QUE O PADRÃO É dev, E NÃO oracle
# A pipeline de CI da Sprint 4 exige a suíte rodando a cada push. Se o padrão
# fosse oracle, todo build sem credencial e sem rota até a FIAP ficaria vermelho
# por motivo de infraestrutura, não por defeito no código — que é exatamente o
# problema que o projeto corrigiu em agosto, quando o único teste existente
# falhava sem Oracle e o Dockerfile precisava de -DskipTests.
#
# O H2 responde "o código está certo" em segundos; o Oracle responde "o banco
# real concorda", e essa pergunta se faz antes de entregar, não a cada commit.
#
# Para inverter e fixar em Oracle, troque o default abaixo por oracle.
# ===========================================================================

spring.profiles.active=${PERFIL_TESTE:dev}

# A configuração compartilhada com main. Sem esta linha a suíte rodaria com um
# formato de data, um mapeamento de UUID e um modelo de sessão JPA diferentes
# dos de produção — porque este arquivo SOMBREIA o application.properties de
# src/main/resources, em vez de somar a ele.
spring.config.import=classpath:comum.properties


# ---------------------------------------------------------------------------
# Segredos de teste
# ---------------------------------------------------------------------------

# Chave fixa, para que a suíte não dependa do ambiente.
#
# ELA NÃO VALE NO MODO oracle: application-oracle.properties é específico de
# perfil e tem precedência sobre este arquivo, e lá a chave é ${JWT_SECRET} sem
# fallback, de propósito. Por isso aquele modo exige TRÊS variáveis —
# DB_USERNAME, DB_PASSWORD e JWT_SECRET —, e não duas.
clyvovet.jwt.secret=dGVzdGUtY2x5dm92ZXQtY2hhdmUtaG1hYy1zaGEyNTYtcGFyYS10ZXN0ZXM=


# ---------------------------------------------------------------------------
# Ajustes que só existem para os testes
# ---------------------------------------------------------------------------

# Os testes disparam dezenas de chamadas do mesmo endereço e bateriam no teto
# por volume, não por falha real. O limite em si é coberto pelo RateLimitTest,
# que o liga sozinho.
clyvovet.rate-limit.enabled=false
