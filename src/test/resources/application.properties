# Onde a suite roda.
#
#   ./mvnw test                        -> dev, H2 em memoria (padrao)
#   PERFIL_TESTE=oracle ./mvnw test    -> Oracle da FIAP, servidor real
#
# O segundo modo exige TRES variaveis, nao duas: DB_USERNAME, DB_PASSWORD e
# JWT_SECRET. A chave de teste definida mais abaixo neste arquivo nao vale la,
# porque application-oracle.properties e especifico de perfil e tem precedencia
# sobre este -- e la a chave e ${JWT_SECRET}, sem fallback, de proposito.
#
# O Oracle e o banco de teste do projeto desde 30/08/2026, e a segunda linha
# acima e como se roda contra ele. Ele exige DB_USERNAME e DB_PASSWORD no
# ambiente, rede ate oracle.fiap.com.br, e GRAVA de verdade num banco
# compartilhado de sala de aula -- ver o cabecalho de application-oracle.properties.
#
# POR QUE O PADRAO CONTINUA SENDO dev, E NAO oracle
# A pipeline de CI da Sprint 4 exige a suite rodando a cada push. Se o padrao
# fosse oracle, todo build sem credencial e sem rota ate a FIAP ficaria
# vermelho por motivo de infraestrutura, nao por defeito no codigo -- que e
# exatamente o problema que o projeto corrigiu em agosto, quando o unico teste
# existente falhava sem Oracle e o Dockerfile precisava de -DskipTests.
# O H2 responde "o codigo esta certo" em segundos; o Oracle responde "o banco
# real concorda", e essa pergunta se faz antes de entregar, nao a cada commit.
#
# Para inverter e fixar em Oracle, troque o default abaixo por oracle.
spring.profiles.active=${PERFIL_TESTE:dev}

clyvovet.jwt.secret=dGVzdGUtY2x5dm92ZXQtY2hhdmUtaG1hYy1zaGEyNTYtcGFyYS10ZXN0ZXM=

# Os testes disparam dezenas de chamadas do mesmo endereco e bateriam no teto
# por volume, nao por falha real. O limite em si e coberto manualmente.
clyvovet.rate-limit.enabled=false
