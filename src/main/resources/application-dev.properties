# H2 em memória, recriado a cada boot. É onde a suíte roda.

# MODE=Oracle faz o H2 aceitar VARCHAR2/NUMBER, o que permite reusar as
# migrations do Oracle.
spring.datasource.url=jdbc:h2:mem:clyvovetdb;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.flyway.locations=classpath:db/migration/oracle

# Quem cria o schema é o Flyway. A validação entidade-schema acontece nos
# perfis de banco real, onde ela prova alguma coisa.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Fallback de propósito: projeto recém-clonado precisa subir sem configuração.
#
# O VALOR NÃO É SEGREDO, E ISSO PRECISA SER ÓBVIO SEM DECODIFICAR NADA
# Antes havia aqui 32 bytes aleatórios de verdade. Funcionava, mas era
# indistinguível de uma chave de produção para quem varre o código — e a régua de
# DevOps desconta -20 por "deixar dados sensíveis expostos (usuário, senha e
# tokens) no código fonte". O critério não é se a chave vale algo; é se alguém
# lendo o repositório consegue saber que não vale.
#
# O base64 abaixo decodifica para a frase que diz o que ele é:
#
#     clyvovet-dev-chave-publica-nao-secreta
#
# Só o perfil dev tem fallback, e ele é H2 em memória. Nos perfis de banco real
# (h2, mysql, oracle) a propriedade é ${JWT_SECRET} sem valor padrão, de
# propósito: lá a ausência da variável derruba o boot, em vez de assumir uma
# chave que está publicada no GitHub.
clyvovet.jwt.secret=${JWT_SECRET:Y2x5dm92ZXQtZGV2LWNoYXZlLXB1YmxpY2EtbmFvLXNlY3JldGE=}
