# ===========================================================================
# Perfil dev — H2 em memória, recriado a cada boot.
#
# É onde a suíte de testes roda (ver src/test/resources/application.properties)
# e onde se desenvolve sem Docker e sem rede até a FIAP.
#
# O que é comum aos quatro perfis está em application.properties.
# ===========================================================================

# ---------- Conexão ----------
# MODE=Oracle faz o H2 aceitar VARCHAR2/NUMBER e a semântica do Oracle, o que
# permite consumir o mesmo conjunto de migrations do banco de teste real.
spring.datasource.url=jdbc:h2:mem:clyvovetdb;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console web do H2. Liberado aqui porque este perfil só roda na máquina de
# quem desenvolve — nos perfis expostos ele nasce desligado.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- Migrations ----------
# O H2 roda com MODE=Oracle, então consome o conjunto do Oracle.
spring.flyway.locations=classpath:db/migration/oracle

# ---------- JPA ----------
# Quem cria o schema é o Flyway. ddl-auto=none evita que o Hibernate reclame
# de nomes de tipo do Oracle rodando sob o dialeto do H2; a validação
# entidade-schema acontece nos perfis de banco real (oracle e mysql), que é
# onde ela de fato prova alguma coisa.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# ---------- Segredos ----------
# Chave de desenvolvimento local, com fallback de propósito: subir o projeto
# recém-clonado não pode exigir configuração. Nos perfis expostos não há
# fallback — ver o comentário lá.
clyvovet.jwt.secret=${JWT_SECRET:rkYIlJliub5QNZcqETol75AapUui0JedF0xcPztVgbo=}
