# Perfil de desenvolvimento local: H2 em memoria, recriado a cada boot.
#
# MODE=Oracle faz o H2 aceitar VARCHAR2/NUMBER e a semantica do Oracle,
# o que permite manter UM unico conjunto de migrations para os dois bancos.
spring.datasource.url=jdbc:h2:mem:clyvovetdb;MODE=Oracle;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console web do H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Quem cria o schema e o Flyway. ddl-auto=none evita que o Hibernate reclame
# de nomes de tipo do Oracle rodando sob o dialeto do H2; a validacao
# entidade-schema acontece no perfil oracle, que e o alvo real de entrega.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Segredo apenas para desenvolvimento local. Em producao vem de JWT_SECRET.
clyvovet.jwt.secret=${JWT_SECRET:rkYIlJliub5QNZcqETol75AapUui0JedF0xcPztVgbo=}
