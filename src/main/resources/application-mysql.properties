# ===========================================================================
# Perfil mysql — PRODUÇÃO. Azure Database for MySQL Flexible Server.
#
# É o perfil padrão do projeto (ver spring.profiles.active na base).
#
# ⚠️  Este perfil ainda NÃO foi executado contra um MySQL real. Ele foi escrito
# junto com as migrations de db/migration/mysql/ enquanto a infra era definida
# com o time de DevOps, e validado apenas em H2 MODE=MySQL pelo
# MigrationsMySqlTest. Trate os valores abaixo como ponto de partida revisado,
# não como configuração validada em produção — é o item E5 do backlog.
#
# O que é comum aos quatro perfis está em application.properties.
# ===========================================================================

# ---------- Conexão ----------
# Credenciais NUNCA versionadas. No Azure Container Apps elas entram como
# secrets do container (ou referência ao Key Vault), nunca como variável de
# ambiente em texto no manifesto.
#
# Sobre a URL:
#   * o host do Flexible Server é <servidor>.mysql.database.azure.com;
#   * sslMode=REQUIRED não é enfeite — o Azure recusa conexão sem TLS por
#     padrão, então sem isso a aplicação não conecta;
#   * serverTimezone não é definido de propósito: as colunas temporais são
#     DATE e DATETIME, que não sofrem conversão de fuso (ver o cabeçalho da
#     V3 em db/migration/mysql/).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/clyvovet?sslMode=REQUIRED}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ---------- Migrations ----------
# Sem baseline, ao contrário do perfil oracle. Um MySQL novo começa vazio,
# então a V1 e a V2 devem rodar de verdade — ligar baseline aqui pularia o
# schema e o seed, e a aplicação subiria contra um banco sem tabela.
spring.flyway.locations=classpath:db/migration/mysql

# ---------- JPA ----------
# Mesma exigência do perfil oracle: entidade e schema não podem divergir.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Desligado aqui, e só aqui: em produção o SQL no log é ruído em volume e
# vaza estrutura de dados para quem tiver acesso ao log.
spring.jpa.show-sql=false

# ---------- Segredos ----------
clyvovet.jwt.secret=${JWT_SECRET}
