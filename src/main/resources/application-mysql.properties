# Azure Database for MySQL Flexible Server — produção, e o perfil padrão.
#
# ATENÇÃO: nunca executado contra um MySQL real. Validado só em H2 MODE=MySQL
# pelo MigrationsMySqlTest. É o item E5 do backlog.

# Credenciais entram como secrets do container, nunca em texto no manifesto.
# sslMode=REQUIRED não é enfeite: o Azure recusa conexão sem TLS.
# serverTimezone fica de fora de propósito — as colunas são DATE e DATETIME.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/clyvovet?sslMode=REQUIRED}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Sem baseline, ao contrário do oracle: um MySQL novo começa vazio e a V1
# precisa rodar de verdade.
spring.flyway.locations=classpath:db/migration/mysql

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Os dois abaixo existem porque o ddl-auto=validate compara a FAMILIA do tipo
# JDBC, e o padrao do Hibernate para MySQL nao bate com o que as migrations
# criam. Sem eles a aplicacao nao sobe. Ficam aqui, e nao no comum.properties,
# porque no Oracle o padrao esta correto e mexer la quebraria a suite de testes.
#
# UUID: o comum.properties pede CHAR para evitar que o Hibernate grave UUID como
# BINARY(16) — mas CHAR faz ele esperar char(36), e as migrations criam
# VARCHAR(36). VARCHAR resolve os dois: continua sendo texto e bate com o DDL.
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=VARCHAR

# Enum: desde o Hibernate 6.2, @Enumerated(STRING) com MySQLDialect mapeia para
# o ENUM nativo do MySQL. As migrations usam VARCHAR, de proposito: com ENUM
# nativo, acrescentar um valor ao enum Java exigiria ALTER TABLE.
spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=VARCHAR

# Em produção o SQL no log é volume e vaza estrutura de dados.
spring.jpa.show-sql=false

clyvovet.jwt.secret=${JWT_SECRET}
