# Azure Database for MySQL Flexible Server — produção, e o perfil padrão.
#
# ATENÇÃO: nunca executado contra um MySQL real. Validado só em H2 MODE=MySQL
# pelo MigrationsMySqlTest. É o item E5 do backlog.

# Credenciais entram como secrets do container, nunca em texto no manifesto.
# sslMode=REQUIRED não é enfeite: o Azure recusa conexão sem TLS.
# serverTimezone fica de fora de propósito — as colunas são DATE e DATETIME.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/clyvovet?sslMode=REQUIRED}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Sem baseline, ao contrário do oracle: um MySQL novo começa vazio e a V1
# precisa rodar de verdade.
spring.flyway.locations=classpath:db/migration/mysql

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Os dois abaixo existem porque o ddl-auto=validate compara a FAMILIA do tipo
# JDBC, e o padrao do Hibernate para MySQL nao bate com o que as migrations
# criam. Sem eles a aplicacao nao sobe. Ficam aqui, e nao no comum.properties,
# porque no Oracle o padrao esta correto e mexer la quebraria a suite de testes.
#
# UUID: o comum.properties pede CHAR para evitar que o Hibernate grave UUID como
# BINARY(16) — mas CHAR faz ele esperar char(36), e as migrations criam
# VARCHAR(36). VARCHAR resolve os dois: continua sendo texto e bate com o DDL.
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=VARCHAR

# Enum: desde o Hibernate 6.2, @Enumerated(STRING) com MySQLDialect mapeia para
# o ENUM nativo do MySQL. As migrations usam VARCHAR, de proposito: com ENUM
# nativo, acrescentar um valor ao enum Java exigiria ALTER TABLE.
spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=VARCHAR

# Em produção o SQL no log é volume e vaza estrutura de dados.
spring.jpa.show-sql=false

# POOL DE CONEXÕES DECLARADO, NÃO HERDADO (achado 2.3 da auditoria)
#
# Antes não havia nenhuma propriedade `spring.datasource.hikari.*`, então valia o
# padrão do HikariCP. O padrão é 10, que por acaso é o número certo aqui — mas
# "por acaso o padrão serve" e "escolhemos 10" são coisas diferentes na hora de
# explicar o porquê, e a segunda é a que sobrevive a uma troca de versão.
#
# POR QUE 10, E NÃO OS 15 QUE A AUDITORIA SUGERIU
# A auditoria pediu 15 dos dois lados, e o motivo dela era o desequilíbrio: a API
# .NET operava no padrão do MySqlConnector, 100 por instância. Esse lado já foi
# fechado em 15 (`Database__MaxPoolSize`), então o desequilíbrio não existe mais e
# o argumento para subir caiu junto.
#
# O que sobra é o hardware. O App Service é B1: UM core, compartilhado com a API
# .NET. Conexão ociosa não processa requisição — num core só, passar de 10 gasta
# memória da JVM (que roda com -Xmx512m) para engordar uma fila que o CPU não
# consegue drenar mais rápido. 10 + 15 = 25 conexões potenciais com uma instância
# de cada.
#
# 25 CONTRA QUANTO? ISSO É MEDIDO, NÃO PRESUMIDO
# O teto de um `Standard_B1ms` depende do tier e a Azure já mudou esses números.
# O `azure/09-verificar.sh` roda `SHOW VARIABLES LIKE 'max_connections'` e compara
# com o orçamento acima — se o teto real for apertado, aparece na verificação, e
# não em produção durante a gravação do vídeo.
spring.datasource.hikari.maximum-pool-size=10

# Deixa o pool encolher quando o app está parado. O padrão do Hikari é
# minimum-idle = maximum-pool-size, ou seja, ele segura as 10 conexões abertas
# para sempre. Num plano compartilhado com outra aplicação, devolver o que não
# está em uso é o comportamento certo.
spring.datasource.hikari.minimum-idle=2

# Abaixo do wait_timeout do servidor, de propósito: quem tem que fechar a conexão
# é o pool, não o gateway do MySQL. Se o servidor derruba primeiro, o Hikari só
# descobre ao tentar usar, e o sintoma é um erro de rede numa requisição de
# usuário.
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.idle-timeout=300000

# Falhar rápido vale mais que pendurar a requisição: 30s de espera por conexão
# estoura o timeout do cliente antes, e o usuário fica olhando a tela girar.
spring.datasource.hikari.connection-timeout=10000

clyvovet.jwt.secret=${JWT_SECRET}
