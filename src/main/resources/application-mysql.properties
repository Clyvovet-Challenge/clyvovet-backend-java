# ---------------------------------------------------------------------------
# Perfil MySQL -- alvo do deploy no Azure Database for MySQL Flexible Server.
#
# ATENCAO: este perfil ainda NAO foi executado contra um MySQL real. Ele foi
# escrito junto com as migrations de db/migration/mysql/ enquanto a infra era
# definida com o time de devops. Trate os valores abaixo como ponto de partida
# revisado, nao como configuracao validada em producao.
# ---------------------------------------------------------------------------
server.port=8080
spring.jackson.serialization.write-dates-as-timestamps=false

# Credenciais NUNCA versionadas. No Azure Container Apps elas entram como
# secrets do container (ou referencia ao Key Vault), nunca como variavel
# de ambiente em texto no manifesto.
#
# Sobre a URL:
#   * o host do Flexible Server e <servidor>.mysql.database.azure.com;
#   * sslMode=REQUIRED nao e enfeite -- o Azure recusa conexao sem TLS por
#     padrao, entao sem isso a aplicacao nao conecta;
#   * serverTimezone nao e definido de proposito: as colunas temporais sao
#     DATETIME, que nao sofre conversao de fuso (ver o cabecalho da
#     V3 em db/migration/mysql/).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/clyvovet?sslMode=REQUIRED}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Ver a nota em application-oracle.properties sobre por que o caminho e
# escrito por extenso em vez de usar o coringa {vendor}.
spring.flyway.locations=classpath:db/migration/mysql

# Sem baseline aqui, ao contrario do perfil oracle. O baseline-version=2
# existe la porque aquele banco foi provisionado a mao pelo db-oracle.sql
# antes do Flyway existir no projeto. Um MySQL novo comeca vazio, entao a V1
# e a V2 devem rodar de verdade -- ligar baseline aqui pularia o schema e o
# seed, e a aplicacao subiria contra um banco sem tabela.
spring.flyway.enabled=true

# Mesma exigencia do perfil oracle: entidade e schema nao podem divergir.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Os ids sao UUID gravados como VARCHAR(36), igual ao Oracle. Sem estas duas
# linhas o Hibernate grava UUID como BINARY(16) no MySQL, e os ids deixariam
# de casar com o seed da V2 e com qualquer dado migrado do Oracle.
spring.jpa.properties.hibernate.id.uuid_jdbc_type=CHAR
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

clyvovet.jwt.secret=${JWT_SECRET}
