<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Marcar retorno')}"></head>
<body>
<header th:replace="~{fragments/layout :: cabecalho}"></header>

<main class="conteudo">
    <h1>Marcar retorno</h1>
    <p class="subtitulo">
        Retorno de <span th:text="${evento.animalNome()}">Bolinha</span> para o atendimento de
        <span th:text="${#temporals.format(evento.data(), 'dd/MM/yyyy')}">08/10/2026</span>.
    </p>

    <form class="cartao formulario" th:action="@{/veterinario/atendimentos/{id}/retorno(id=${evento.id()})}"
          th:object="${retorno}" method="post">
        <p class="aviso aviso-erro" role="alert" th:if="${#fields.hasGlobalErrors()}"
           th:each="e : ${#fields.globalErrors()}" th:text="${e}">Erro</p>

        <label for="data">Data</label>
        <input type="date" th:field="*{data}" th:errorclass="campo-com-erro" required>
        <p class="erro-campo" th:if="${#fields.hasErrors('data')}" th:errors="*{data}">Data inválida</p>

        <label for="hora">Horário</label>
        <input type="time" th:field="*{hora}" th:errorclass="campo-com-erro" required>
        <p class="erro-campo" th:if="${#fields.hasErrors('hora')}" th:errors="*{hora}">Horário inválido</p>
        <p class="dica">O retorno fica com você e precisa cair num horário da sua agenda.</p>

        <button type="submit" class="botao botao-primario">Marcar retorno</button>
    </form>

    <a class="voltar" th:href="@{/veterinario/atendimentos}">Voltar sem marcar</a>
</main>

</body>
</html>
