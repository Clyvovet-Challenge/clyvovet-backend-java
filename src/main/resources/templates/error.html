<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<!--
    Pagina de erro das telas. O nome "error.html" e o que o Spring Boot procura
    para responder 403, 404 e 500 a um navegador. Para a API nada muda: quem
    pede JSON continua recebendo JSON.
-->
<head th:replace="~{fragments/layout :: head('Erro')}"></head>
<body>
<header th:replace="~{fragments/layout :: cabecalho}"></header>

<main class="conteudo" th:switch="${status}">
    <th:block th:case="403">
        <h1>Acesso negado</h1>
        <p class="subtitulo">Seu perfil não tem permissão para abrir esta página.</p>
    </th:block>
    <th:block th:case="404">
        <h1>Página não encontrada</h1>
        <p class="subtitulo">O endereço não existe ou foi removido.</p>
    </th:block>
    <th:block th:case="*">
        <h1>Algo deu errado</h1>
        <p class="subtitulo">Tente de novo em instantes. Se continuar, avise o suporte.</p>
    </th:block>
    <a class="botao botao-primario" th:href="@{/}">Voltar ao início</a>
</main>

</body>
</html>
