# Configuração válida em todos os perfis.
#
# Arquivo separado porque src/test/resources/application.properties substitui o
# de src/main/resources em vez de somar a ele. Com nome próprio, os dois lados
# importam o mesmo arquivo. Quem importa pode sobrescrever.

spring.jackson.serialization.write-dates-as-timestamps=false

# Ligado, a sessão do Hibernate fica aberta durante a serialização da resposta.
# Nenhum relacionamento é LAZY, então nada depende disso.
spring.jpa.open-in-view=false

# Sem estas duas, o Hibernate grava UUID como BINARY(16) no MySQL e os ids
# param de casar com o seed da V2. Em todos os bancos a coluna é VARCHAR(36).
spring.jpa.properties.hibernate.id.uuid_jdbc_type=CHAR
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

# Cada perfil declara a própria pasta de migrations, sempre por extenso. O
# coringa {vendor} do Flyway resolve pelo banco da conexão: dev e h2 conectam
# num H2 e viraria "h2", mas quem serve a eles é oracle/ (MODE=Oracle).
spring.flyway.enabled=true

# So a probe de saude. O padrao do actuator publica versao, beans e
# configuracao, que sao um mapa da aplicacao para quem alcancar a porta.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Teto de paginacao -- o mesmo 100 que a API .NET impoe no `pageSize`.
# Sem isto o Spring honra qualquer `size`: `?size=100000` carrega a tabela
# inteira em memoria e serializa tudo. O Spring TRUNCA no maximo em vez de
# responder 400 como a .NET; o resultado que importa e o mesmo -- nenhuma das
# duas devolve mais de 100 itens por pagina.
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=10

# ----------------------------------------------------------------------------
# Anexos do prontuario (V17)
# ----------------------------------------------------------------------------
# O teto que o usuario ve e 8 MB, imposto em DocumentoClinicoService. Estes dois
# sao maiores de proposito: se fossem iguais, o arquivo de 8,1 MB morreria no
# parser do multipart -- antes de o controller existir -- e a pessoa leria um
# erro de infraestrutura em vez de "o arquivo passa de 8 MB".
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=14MB

# Interruptor da feature. Em false, o DocumentoClinicoController sai do contexto
# e as quatro rotas de anexo respondem 404; o resto da API nao muda. E o plano de
# aborto de uma feature nova que guarda binario no banco.
clyvovet.documentos.habilitado=true

# A referencia da requisicao no log, alimentada pelo CorrelacaoFilter.
#
# Sem ela, o id existe na resposta e nao aparece em lugar nenhum do log -- o que
# derrota o proposito: o usuario cita a referencia e nao ha o que procurar. O
# `defaultValue` cobre o que roda fora de uma requisicao (startup, agendados),
# onde nao ha correlacao nenhuma a imprimir.
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{correlacao:-sem-requisicao}] %logger{36} - %msg%n
