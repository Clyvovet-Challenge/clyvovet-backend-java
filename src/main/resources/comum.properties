# ===========================================================================
# Configuração compartilhada por main E pelos testes.
#
# POR QUE ESTE ARQUIVO EXISTE, COM ESTE NOME
# src/test/resources/application.properties SOMBREIA o de src/main/resources —
# não mistura, substitui. Só um arquivo com esse nome é carregado, e no teste
# vence o do test. Verificado, não presumido.
#
# A consequência é que tudo que morasse na base de main sumiria durante os
# testes: a suíte rodaria com um formato de data, um mapeamento de UUID e um
# modelo de sessão JPA diferentes dos de produção — e validaria um sistema que
# não é o que vai ser entregue. Foi o que aconteceu com spring.jpa.open-in-view,
# que estava na base desde sempre e nunca valeu num teste sequer.
#
# Um nome DIFERENTE de application.properties resolve: não há sombreamento, e
# os dois lados importam o mesmo arquivo com spring.config.import.
#
# PRECEDÊNCIA: o que é importado entra ANTES de quem importa, então tanto os
# perfis quanto o arquivo de teste continuam podendo sobrescrever o que está
# aqui.
# ===========================================================================

# ---------------------------------------------------------------------------
# JSON
# ---------------------------------------------------------------------------

# Datas como texto ISO-8601 ("2026-08-20"), e não como array de inteiros.
# Estava definido em h2, oracle e mysql, mas NÃO em dev — ou seja, a suíte
# validava um formato de JSON diferente do que a produção devolve. Na base,
# os quatro perfis passam a concordar.
spring.jackson.serialization.write-dates-as-timestamps=false


# ---------------------------------------------------------------------------
# JPA
# ---------------------------------------------------------------------------

# Desligado explicitamente. Ligado (o padrão do Spring) a sessão do Hibernate
# fica aberta durante a serialização da resposta, segurando a conexão por mais
# tempo e permitindo que uma consulta dispare fora da camada de serviço.
# Nenhum relacionamento do projeto é LAZY, então nada depende disso.
spring.jpa.open-in-view=false

# Os ids são UUID gravados como VARCHAR(36) em TODOS os bancos — é assim na
# V1 tanto em oracle/ quanto em mysql/, e o H2 consome o conjunto do Oracle.
# Sem estas duas linhas o Hibernate grava UUID como BINARY(16) no MySQL, e os
# ids deixariam de casar com o seed da V2 e com qualquer dado migrado.
# Como a verdade é a mesma nos quatro perfis, ela mora aqui.
spring.jpa.properties.hibernate.id.uuid_jdbc_type=CHAR
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR


# ---------------------------------------------------------------------------
# Flyway — onde as migrations moram, e por que o caminho é escrito por extenso
# ---------------------------------------------------------------------------
#
# As migrations estão separadas por banco em db/migration/<banco>/, porque o
# MySQL não entende VARCHAR2/NUMBER e o Oracle não entende TINYINT/DATETIME.
# Cada perfil declara a sua pasta; só o `enabled` é comum.
#
# O caminho é escrito por extenso de propósito. O Flyway oferece o coringa
# `classpath:db/migration/{vendor}`, que parece o óbvio aqui, mas ele resolve
# pelo banco da CONEXÃO — e os perfis dev e h2 conectam num H2, então {vendor}
# viraria "h2" e o Flyway não acharia pasta nenhuma. Como o H2 roda com
# MODE=Oracle, quem serve a ele é a pasta oracle/, o que o coringa não tem como
# adivinhar. Explícito não tem esse problema.
#
# Esta nota fica aqui, e não repetida em cada perfil, porque a razão é uma só.
spring.flyway.enabled=true
