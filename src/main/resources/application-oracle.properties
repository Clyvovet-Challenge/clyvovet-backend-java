# ===========================================================================
# Perfil oracle — BANCO DE TESTE contra servidor real (Oracle da FIAP).
#
# Este perfil mudou de papel em 30/08/2026. Ele era o alvo de entrega; agora a
# produção é o MySQL da Azure (perfil mysql, e o padrão do projeto), e o Oracle
# passou a ser onde se confere o comportamento contra um servidor de verdade —
# coisa que o H2, mesmo em MODE=Oracle, não prova.
#
# COMO RODAR A SUÍTE CONTRA ELE
#   export DB_USERNAME=rm000000
#   export DB_PASSWORD=suasenha
#   export JWT_SECRET=<chave base64 com pelo menos 32 bytes>
#   PERFIL_TESTE=oracle ./mvnw test
#
# São TRÊS variáveis, não duas: a chave de teste definida em
# src/test/resources/application.properties não vale aqui, porque este arquivo
# é específico de perfil e tem precedência sobre ela.
#
# ⚠️  O Oracle da FIAP é um banco COMPARTILHADO de sala de aula, e a suíte grava
# de verdade (não há rollback de teste, por decisão de projeto). Rodar aqui
# significa: aplicar as migrations pendentes no schema, criar os usuários do
# DevDataSeeder e inserir/remover linhas nas tabelas do projeto. É o preço de
# testar contra servidor real; só não pode ser uma surpresa.
#
# O que é comum aos quatro perfis está em application.properties.
# ===========================================================================

# ---------- Conexão ----------
# Credenciais NUNCA versionadas — sempre por variável de ambiente.
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:orcl}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ---------- Migrations ----------
spring.flyway.locations=classpath:db/migration/oracle

# baseline-version=2 marca V1 (schema) e V2 (seed) como já aplicadas nos bancos
# provisionados pelo db-oracle.sql antes da adoção do Flyway, e roda apenas da
# V3 em diante. Com baseline-version=1 o seed rodaria de novo e duplicaria os
# dados. É por isso que o perfil mysql não tem baseline: lá o banco começa
# vazio e a V1 precisa rodar de verdade.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2

# ---------- JPA ----------
# validate garante que entidade e schema não voltem a divergir. Vale aqui e no
# perfil mysql: são os dois bancos reais do projeto, um de teste e um de
# produção, e nenhum dos dois pode divergir das entidades.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

# ---------- Segredos ----------
clyvovet.jwt.secret=${JWT_SECRET}
