server.port=8080
spring.jackson.serialization.write-dates-as-timestamps=false

# Credenciais NUNCA versionadas. Defina por variavel de ambiente:
#   export DB_USERNAME=rm000000
#   export DB_PASSWORD=suasenha
#   export JWT_SECRET=<chave base64 com pelo menos 32 bytes>
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:orcl}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ---------------------------------------------------------------------------
# Onde o Flyway procura as migrations
#
# As migrations estao separadas por banco em db/migration/<banco>/, porque o
# MySQL nao entende VARCHAR2/NUMBER e o Oracle nao entende TINYINT/DATETIME.
#
# O caminho e escrito por extenso de proposito. O Flyway oferece o coringa
# `classpath:db/migration/{vendor}`, que parece o obvio aqui, mas ele resolve
# pelo banco da CONEXAO -- e os perfis dev e h2 conectam num H2, entao {vendor}
# viraria "h2" e o Flyway nao acharia pasta nenhuma. Como o H2 roda com
# MODE=Oracle, quem serve a ele e a pasta oracle/, o que o coringa nao tem como
# adivinhar. Explicito nao tem esse problema.
# ---------------------------------------------------------------------------
spring.flyway.locations=classpath:db/migration/oracle

# O schema e versionado pelo Flyway.
# baseline-version=2 marca V1 (schema) e V2 (seed) como ja aplicadas nos bancos
# que foram provisionados pelo db-oracle.sql antes da adocao do Flyway, e roda
# apenas da V3 em diante. Com baseline-version=1 o seed rodaria de novo e
# duplicaria os dados.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2

# validate garante que entidade e schema nao voltem a divergir. Este e o alvo
# real de entrega, entao a checagem estrita fica aqui.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.id.uuid_jdbc_type=CHAR
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=CHAR

clyvovet.jwt.secret=${JWT_SECRET}
