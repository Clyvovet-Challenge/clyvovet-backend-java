# Oracle da FIAP — banco de TESTE contra servidor real.
#
#   export DB_USERNAME=rm000000
#   export DB_PASSWORD=suasenha
#   export JWT_SECRET=<base64, mínimo 32 bytes>
#   PERFIL_TESTE=oracle ./mvnw test
#
# São três variáveis: a chave de teste não vale aqui, porque este arquivo tem
# precedência sobre src/test/resources/application.properties.
#
# ATENÇÃO: banco compartilhado de sala de aula, e a suíte grava de verdade —
# aplica migrations, cria os usuários do seeder e insere linhas.

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:orcl}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.flyway.locations=classpath:db/migration/oracle

# baseline-version=2 marca V1 e V2 como aplicadas nos bancos provisionados pelo
# db-oracle.sql antes do Flyway. Com 1, o seed rodaria de novo e duplicaria.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect

clyvovet.jwt.secret=${JWT_SECRET}
