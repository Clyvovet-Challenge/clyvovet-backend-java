spring.application.name=clyvovet

# Perfil padrao: mysql, que e o alvo de PRODUCAO (Azure Database for MySQL).
# O perfil oracle continua existindo, mas mudou de papel: deixou de ser o alvo
# de entrega e passou a ser o banco de TESTE contra servidor real (Oracle da
# FIAP). Ver o cabecalho de cada um dos dois arquivos.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}

# Desligado explicitamente. Ligado (o padrao do Spring) a sessao do Hibernate
# fica aberta durante a serializacao da resposta, segurando a conexao por mais
# tempo e permitindo que uma consulta dispare fora da camada de servico.
# Nenhum relacionamento do projeto e LAZY, entao nada depende disso.
spring.jpa.open-in-view=false
