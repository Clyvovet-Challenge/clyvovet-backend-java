# ===========================================================================
# Configuração base — vale para TODOS os perfis.
#
# COMO ESTE ARQUIVO SE RELACIONA COM OS DEMAIS
# O Spring lê este arquivo primeiro e depois o do perfil ativo, que sobrescreve
# o que repetir. Então a regra aqui é: se o valor é o mesmo em todo lugar, ele
# mora neste arquivo e some dos outros.
#
# Isso não é arrumação: server.port, o formato de datas e o mapeamento de UUID
# estavam copiados em três dos quatro perfis, e o quarto (dev) ficou sem eles.
# Configuração duplicada não fica duplicada por muito tempo — ela diverge, e a
# divergência aparece como comportamento diferente entre o ambiente onde os
# testes rodam e o ambiente que vai para produção.
#
# OS QUATRO PERFIS
#   dev      H2 em memória, recriado a cada boot. Desenvolvimento e testes
#   h2       H2 em modo servidor, para o docker-compose
#   oracle   Oracle da FIAP — banco de TESTE contra servidor real
#   mysql    Azure Database for MySQL — PRODUÇÃO, e o padrão do projeto
# ===========================================================================

spring.application.name=clyvovet
server.port=8080

# Perfil padrão: mysql, que é o alvo de PRODUÇÃO (Azure Database for MySQL).
# O perfil oracle continua existindo, mas mudou de papel em 30/08/2026: deixou
# de ser o alvo de entrega e passou a ser o banco de TESTE contra servidor real.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}

# O miolo compartilhado mora em comum.properties, importado aqui e também pelo
# application.properties dos testes. Ver o cabeçalho de lá para o motivo: um
# arquivo chamado application.properties em src/test/resources sombreia este,
# e o que estivesse só aqui não valeria durante a suíte.
spring.config.import=classpath:comum.properties
