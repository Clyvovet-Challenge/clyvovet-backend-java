server.port=8080
spring.application.name=clyvovet
spring.jackson.serialization.write-dates-as-timestamps=false

# H2 em modo servidor. O host clyvovet-db so existe na rede do docker-compose;
# para rodar localmente sem Docker use o perfil dev.
# MODE=Oracle mantem UM unico conjunto de migrations para H2 e Oracle.
spring.datasource.url=jdbc:h2:tcp://clyvovet-db:1521/clyvovet;MODE=Oracle
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# O schema e criado e versionado pelo Flyway
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Console do H2 desligado por padrao: este perfil roda atras de porta publica
# no deploy (docker-compose + deploy.sh), e o console sem autenticacao
# equivale a acesso total ao banco. Ligue soh para depurar localmente:
#   H2_CONSOLE_ENABLED=true docker compose up
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.settings.web-allow-others=${H2_CONSOLE_ENABLED:false}

# Sem fallback de proposito: subir este perfil sem JWT_SECRET falha no boot
# em vez de usar uma chave conhecida. Gere uma com: openssl rand -base64 32
clyvovet.jwt.secret=${JWT_SECRET}
