# H2 em modo servidor, para o docker-compose.
# Não serve para deploy: a DevOps não aceita H2 na entrega (spec 04).

# O host clyvovet-db só existe na rede do docker-compose.
spring.datasource.url=jdbc:h2:tcp://clyvovet-db:1521/clyvovet;MODE=Oracle
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.locations=classpath:db/migration/oracle

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Este perfil roda atrás de porta pública, e o console sem autenticação
# equivale a acesso total ao banco. Para depurar: H2_CONSOLE_ENABLED=true
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.settings.web-allow-others=${H2_CONSOLE_ENABLED:false}

# Sem fallback: falhar no boot é melhor que usar uma chave versionada.
clyvovet.jwt.secret=${JWT_SECRET}
