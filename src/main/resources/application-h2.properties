server.port=8080
spring.application.name=clyvovet
spring.jackson.serialization.write-dates-as-timestamps=false

# H2 em modo servidor. O host clyvovet-db so existe na rede do docker-compose;
# para rodar localmente sem Docker use o perfil dev.
# MODE=Oracle mantem UM unico conjunto de migrations para H2 e Oracle.
spring.datasource.url=jdbc:h2:tcp://clyvovet-db:1521/clyvovet;MODE=Oracle
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# O schema e criado e versionado pelo Flyway
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

clyvovet.jwt.secret=${JWT_SECRET:ZGVzZW52b2x2aW1lbnRvLWNseXZvdmV0LWNoYXZlLWhtYWMtc2hhMjU2LWxvY2Fs}
