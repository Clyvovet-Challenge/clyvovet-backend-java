# ===========================================================================
# Perfil h2 — H2 em modo servidor, para o docker-compose.
#
# ATENÇÃO: a DevOps NÃO aceita H2 como banco da entrega ("H2 não será aceito",
# spec 04). Este perfil serve para subir a stack local com Docker, não para
# deploy. O alvo de produção é o perfil mysql.
#
# O que é comum aos quatro perfis está em application.properties.
# ===========================================================================

# ---------- Conexão ----------
# O host clyvovet-db só existe na rede do docker-compose; para rodar localmente
# sem Docker use o perfil dev.
spring.datasource.url=jdbc:h2:tcp://clyvovet-db:1521/clyvovet;MODE=Oracle
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ---------- Migrations ----------
spring.flyway.locations=classpath:db/migration/oracle

# ---------- JPA ----------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ---------- Segurança ----------
# Console do H2 desligado por padrão: este perfil roda atrás de porta pública
# no deploy, e o console sem autenticação equivale a acesso total ao banco.
# Ligue só para depurar localmente:
#   H2_CONSOLE_ENABLED=true docker compose up
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.settings.web-allow-others=${H2_CONSOLE_ENABLED:false}

# Sem fallback de propósito: subir este perfil sem JWT_SECRET falha no boot em
# vez de usar uma chave que está publicada no repositório.
# Gere uma com: openssl rand -base64 32
clyvovet.jwt.secret=${JWT_SECRET}
